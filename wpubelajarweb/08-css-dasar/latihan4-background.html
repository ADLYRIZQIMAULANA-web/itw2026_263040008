<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latihan quotes</title>
    <style>
        body{
font-family: 'Courier New', Courier, monospace;
font-weight: bold;
color: #F8F8FF;
text-align: center;
background-color: #0F172A;
background-image: linear-gradient(to bottom, rgb(15 23 42 / 90%)60%,rgb(15 23 42 / 40%)), url('https://fastly.picsum.photos/id/10/1000/1000.jpg?hmac=8imXWM_Cxe6_cWjyUbT2Vh7oxwiz12HfzJHp6CLoGwM');
background-size: cover;
background-position: center;
background-attachment: fixed;
min-height: 100vh;
        }
h1{
font-size: 4em;
text-transform: uppercase;
font-style: italic;
letter-spacing: 10px;
text-decoration: none;

text-decoration-color: #7393d9;
/*text-shadow: 5px 5px 0 rgb(215 215 215 / 10%);*/
background-image: linear-gradient(to right, rgb(0, 0, 254),rgb(255, 75, 255));
background-clip: text;
color: transparent;
filter: drop-shadow(0 0 10px rgba(8, 168, 205, 0.5));
}
.quote{
font-size: 22px;
line-height: 2,2;
word-spacing: 5px;
background-color: rgb( 255 255 255 / 5%);
max-width: 700px;
margin: auto;
padding: 40px;
border-radius: 20px;
border: 1px solid rgb( 255 255 255 / 10%);
box-shadow: 0 10px 30px rgb(0 0 0 / 50%);
}
span{
color: rgb(219, 20, 60);
text-decoration: none;
text-shadow:0 0 10px rgb(242, 48, 87);



}
.credit{
font-size: 12px;
letter-spacing: 2px;
color: rgb(151 151 151 / 50%);
font-weight: normal;
text-transform: uppercase;
border-top: 1px solid rgb(255 255 255 / 20%);
width: 30%;
margin: 30px auto;
padding: top;

}
    </style>
</head>
<body>
    <h1>GEMERLAP MALAM, KENANGAN ABADI</h1>
    <p class="quote">Musik bukan sekadar alunan nada,<br> melainkan tempat di mana <span>perasaan</span>  <br>bertemu, cerita tercipta, dan kenangan terukir <br> Karena setiap irama memiliki kisah,<br> dan setiap malam menyimpan momen yang tak akan pernah terlupakan.</p>
<p class="credit">Bob Marley</p>
</body>
</html>
