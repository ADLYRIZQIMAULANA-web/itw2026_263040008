<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latihan quotes</title>
    <style>
        body{
font-family: 'Courier New', Courier, monospace;
font-weight: bold;
color: #F8F8FF;
text-align: center;
background-color: #0F172A;


        }
h1{
font-size: 45px;
text-transform: uppercase;
font-style: italic;
letter-spacing: 10px;
text-decoration: underline;
text-decoration-style:wavy ;
text-decoration-color: #7393d9;
text-shadow: 5px 5px 0 rgb(215 215 215 / 10%);
color: #0042de;
}
.quote{
font-size: 22px;
line-height: 2,2;
word-spacing: 5px;
}
span{
color: crimson;
text-decoration: line-through;


}
.credit{
font-size: 12px;
letter-spacing: 2px;
color: rgb(151 151 151 / 50%);
font-weight: normal;

}
    </style>
</head>
<body>
    <h1>GEMERLAP MALAM, KENANGAN ABADI</h1>
    <p class="quote">Musik bukan sekadar alunan nada,<br> melainkan tempat di mana <span>perasaan</span>  <br>bertemu, cerita tercipta, dan kenangan terukir <br> Karena setiap irama memiliki kisah,<br> dan setiap malam menyimpan momen yang tak akan pernah terlupakan.</p>
<p class="credit">Bob Marley</p>
</body>
</html>
