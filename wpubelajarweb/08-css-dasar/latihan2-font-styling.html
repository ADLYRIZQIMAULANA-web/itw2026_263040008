<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latihan quotes</title>
    <style>
        body{
font-family: 'Courier New', Courier, monospace;
font-weight: bold;
color: rgb(34, 29, 29);
text-align: center;


        }
h1{
font-size: 45px;
text-transform: uppercase;
font-style: italic;
letter-spacing: 10px;
text-decoration: underline;
text-decoration-style:wavy ;
text-decoration-color: rgb(27, 27, 27);
text-shadow: 5px 5px 0 rgb(163, 154, 154);
}
.quote{
font-size: 22px;
line-height: 2,2;
word-spacing: 5px;
}
span{
color: rgb(95, 93, 93);
text-decoration: line-through;


}
credit{
font-size: 12px;
letter-spacing: 2px;
color: rgb(46, 45, 45);
font-weight: normal;

}
    </style>
</head>
<body>
    <h1>GEMERLAP MALAM, KENANGAN ABADI</h1>
    <p class="quote">Musik bukan sekadar alunan nada,<br> melainkan tempat di mana <span>perasaan</span>  <br>bertemu, cerita tercipta, dan kenangan terukir <br> Karena setiap irama memiliki kisah,<br> dan setiap malam menyimpan momen yang tak akan pernah terlupakan.</p>
<p class="credit">Bob Marley</p>
</body>
</html>
