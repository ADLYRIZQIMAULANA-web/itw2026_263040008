<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Input Atribut, Checkbox & radio</title>
</head>
<body>
<h1>Contoh Input Atribut, Checkbox & radio</h1>

<form>
<label for="nama">Nama: 
<input type="text" name="nama" id="nama" placeholder="Masukan Nama" autocomplete="off" autofocus required><br>
</label>
<br>
<h3>hobby</h3>
<label for="hobby1">
<input type="checkbox" name="hobby1" id="hobby1" value="Olah Raga"checked>Olahraga<br>
</label>
<label for="hobby2">
<input type="checkbox" name="hobby2" id="hobby2" value="Baca Buku">Baca Buku<br>
</label>
<label for="hobby3">
<input type="checkbox" name="hobby3" id="hobby3" value="Nonton Film">Nonton Film<br>
</label>
<label for="hobby4">
<input type="checkbox" name="hobby4" id="hobby4" value="Musik">Musik<br>
</label>
<br>
<h3>Jenis Kelamin</h3>
<label for="laki-laki">
<input type="radio" name="Jenis Kelamin " id="laki-laki" value="L
aki-laki"checked>Laki-laki<br>
</label>
<label for="perempuan">
<input type="radio" name="Jenis Kelamin " id="perempuan" value="Perempuan">Perempuan<br>
</label>



<br>
<button type="submit">Kirim</button>



</form>


</body>
</html>
