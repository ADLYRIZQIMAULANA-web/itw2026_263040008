<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Element Form</title>
</head>
<body>
<h1>Coba element form dalam tabel</h1>
<form>
    <table cellpadding="4">
<tr>
    <td align="right">
        <label for="nama">Nama:
</label></td>
    <td><input type="text" name="nama" id="nama" placeholder="Masukan Nama"><br></td>
</tr>
<tr>
    <td align="right"><label for="Password">Password:
</label></td>
    <td><input type="password" name="Password" id="Password" placeholder="Masukan Password"><br>
    </td>
</tr>
<tr>
    <td align="right"><label for="email">Email:
</label></td>
    <td><input type="email" name="email" id="email" placeholder="Masukan Email"></td>
</tr>
<tr>
    <td align="right"><label for="Angka">Angka:
</label></td>
    <td><input type="number" name="Number" id="Number"min="0" max="100" step="5" placeholder="Masukan Angka"></td>
</tr>
<tr>
    <td align="right"><label for="Tanggal">Tanggal:
</label></td>
    <td><input type="date" name="Tanggal" id="Tanggal"><br></td>
</tr>
<tr>
    <td align="right"><label for="Warna">Pilih Warna:</label></td>
<td><input type="color" name="Warna" id="Warna"><br></td>
</tr>



<tr>
    <td colspan="2">
        <button type="submit">Kirim</button></td>
</tr>
<button type="submit">Kirim</button>


     </table>
</form>

</form>
</body>
</html>
