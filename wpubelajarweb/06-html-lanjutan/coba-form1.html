<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Element Form</title>
</head>
<body>
<h1>Contoh Element Form Pada HTML</h1>
<form>
<label for="nama">Nama:
<input type="text" name="nama" id="nama" placeholder="Masukan Nama"><br>
</label>

<label for="Password">Password:
<input type="password" name="Password" id="Password" placeholder="Masukan Password"><br>
</label>  

<label for="email">Email:
<input type="email" name="email" id="email" placeholder="Masukan Email">
</label>
<br>

<label for="Angka">Angka:
<input type="number" name="Number" id="Number"min="0" max="100" step="5" placeholder="Masukan Angka">
</label>
<br>
<label for="Tanggal">Tanggal:
<input type="date" name="Tanggal" id="Tanggal"><br>
</label>
<label for="Warna">Pilih Warna:
<input type="color" name="Warna" id="Warna"><br>

<button type="submit">Kirim</button>


</form>

</form>
</body>
</html>
